name: Terminal Asset Validation

on:
  push:
    branches: [main, develop]
    paths:
      - terminal.svg
      - scripts/make-terminal-svg.js
      - .github/workflows/terminal.yml
  pull_request:
    branches: [main, develop]
    paths:
      - terminal.svg
      - scripts/make-terminal-svg.js
      - .github/workflows/terminal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify terminal asset
        run: node scripts/make-terminal-svg.js --check
